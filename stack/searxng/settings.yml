# SearXNG for the stack: a private metasearch engine that only the stack uses.
# deploy.sh fetches this into /opt/automation/searxng/, which is mounted as
# /etc/searxng. Everything not set here keeps SearXNG's defaults.
#
# n8n's SearXNG tool reads results as JSON, which SearXNG turns off by
# default. The secret key comes from SEARXNG_SECRET in .env (deploy.sh makes it).
# No published port except on 127.0.0.1, so the bot limiter (and the Valkey
# database it needs) stays off.

use_default_settings: true

general:
  instance_name: "ai search"

server:
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0

# Engines: SearXNG's default list asks several engines per query, so one that
# is paused after a CAPTCHA or a "too many requests" doesn't empty the results.
